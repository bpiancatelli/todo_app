name: Build Android APK

on:
  push:
    branches: ["claude/practical-bohr-FxtJy", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer
        run: pip install --upgrade buildozer cython

      - name: Cache Buildozer platform
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/packages
            ~/.buildozer/android/platform/python-for-android
            ~/.buildozer/android/platform/android-ndk-r25b
            ~/.buildozer/android/platform/android-sdk
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Pre-accept Android SDK licenses for Buildozer
        run: |
          # Buildozer downloads its own SDK to ~/.buildozer/android/platform/android-sdk
          # Pre-create license files so sdkmanager never prompts interactively
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-debug
          path: bin/*.apk
          retention-days: 30
