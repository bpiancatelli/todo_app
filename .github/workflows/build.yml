name: Build Android APK

on:
  push:
    branches: ["claude/practical-bohr-FxtJy", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer
        run: pip install --upgrade buildozer cython

      - name: Accept Android SDK licenses and install build-tools
        run: |
          # Accept all licenses non-interactively
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # Install build-tools (contains aidl) and platform
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/packages
            ~/.buildozer/android/platform/python-for-android
            ~/.buildozer/android/platform/android-ndk-r25b
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        env:
          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}
          ANDROIDNDK: ${{ runner.temp }}/ndk
        run: |
          # Point buildozer to the pre-installed SDK with accepted licenses
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-debug
          path: bin/*.apk
          retention-days: 30
