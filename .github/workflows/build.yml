name: Build Android APK

on:
  push:
    branches: ["claude/practical-bohr-FxtJy", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer
        run: pip install --upgrade buildozer cython

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/packages
            ~/.buildozer/android/platform/python-for-android
            ~/.buildozer/android/platform/android-ndk-r25b
            ~/.buildozer/android/platform/android-sdk
          key: buildozer-sdk-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-sdk-v3-

      - name: Set up Android SDK for Buildozer
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR"

          # Only download if sdkmanager not present
          if [ ! -f "$SDK_DIR/tools/bin/sdkmanager" ]; then
            echo "Downloading Android commandline-tools..."
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip -O /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_DIR"
            # The zip extracts to tools/ — verify sdkmanager is there
            ls "$SDK_DIR/tools/bin/"
          fi

          # Accept licenses
          mkdir -p "$SDK_DIR/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$SDK_DIR/licenses/android-sdk-preview-license"

          # Install build-tools (contains aidl) and platform
          yes | "$SDK_DIR/tools/bin/sdkmanager" \
            --sdk_root="$SDK_DIR" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools" || true

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-debug
          path: bin/*.apk
          retention-days: 30
